# =====================================================================
#  Malen PWA - docker-compose
# ---------------------------------------------------------------------
#  Verwendung auf der Synology:
#    1) Ordner /volume1/docker/malen/ anlegen
#    2) Projektdateien dort ablegen
#    3) Im Container Manager als Projekt bauen und starten
#
#  Außen: Port 3003 (HTTP) -> innen 3000
#  Reverse Proxy:
#    https://malen.mtankurt.synology.me -> http://<synology-ip>:3003
# =====================================================================
services:
  malen:
    build:
      context: .
      dockerfile: Dockerfile
    image: malen-pwa:1.0.0
    container_name: malen-pwa
    restart: unless-stopped
    environment:
      PORT: "3000"
      BASE_PATH: ""
      PUBLIC_BASE_URL: "https://malen.mtankurt.synology.me"
      TZ: "Europe/Berlin"
    ports:
      - "3003:3000"
    volumes:
      - ./public:/app/public:ro
      - ./server:/app/server
      - /app/server/node_modules
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
